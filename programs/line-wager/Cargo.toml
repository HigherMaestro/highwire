[package]
name = "line-wager"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "The Line's wager program: a best-of-5 series played on-chain, commit then reveal, with the stakes held by the program (docs/wager-mode.md)."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
custom-heap = []
custom-panic = []

[dependencies]
solana-program = "=1.18.26"
borsh = { version = "=1.5.1", features = ["derive"] }

[dev-dependencies]
serde_json = "=1.0.128"
solana-program-test = "=1.18.26"
solana-sdk = "=1.18.26"
tokio = { version = "=1.38.1", features = ["macros", "rt-multi-thread"] }
ed25519-dalek = "=1.0.1"
