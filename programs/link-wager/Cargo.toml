[package]
name = "link-wager"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Link battles' practice-stake program: both stakes held by the program, paid on the referee's signed result or refunded (docs/link-wager.md)."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
custom-heap = []
custom-panic = []

[dependencies]
solana-program = "=1.18.26"
borsh = { version = "=1.5.1", features = ["derive"] }

[dev-dependencies]
serde_json = "=1.0.128"
solana-program-test = "=1.18.26"
solana-sdk = "=1.18.26"
tokio = { version = "=1.38.1", features = ["macros", "rt-multi-thread"] }
ed25519-dalek = "=1.0.1"
