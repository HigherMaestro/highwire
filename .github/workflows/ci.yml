name: CI

# Checks only (docs/boundaries.md 5.5). Nothing here deploys, publishes, or holds a secret, and the live checks
# (smoke, simulate, rehearse) stay manual: they need the network and real RPCs. Actions are pinned to commits.

on:
  pull_request:
    # Labels too: the freeze check below is settled by one.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: CI's own scripts
        run: npm run test:ci

  changes:
    name: what changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      program: ${{ steps.diff.outputs.program }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node .github/scripts/changes.mjs

  program:
    name: the wager program and its parity with the rules
    needs: changes
    if: needs.changes.outputs.program == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # The toolchain the program is built and tested with (docs/audit/line-wager.md).
      SOLANA_VERSION: v1.18.18
      RUST_VERSION: 1.98.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/solana
            ~/.local/share/solana
            programs/line-wager/target
          key: program-${{ runner.os }}-${{ env.SOLANA_VERSION }}-${{ env.RUST_VERSION }}-${{ hashFiles('programs/line-wager/Cargo.lock') }}
      - name: Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal && rustup default "$RUST_VERSION"
      - name: Solana's tools
        run: |
          if [ ! -x "$HOME/.local/share/solana/install/active_release/bin/cargo-build-sbf" ]; then
            sh -c "$(curl -sSfL "https://release.anza.xyz/${SOLANA_VERSION}/install")"
          fi
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run test:program

  freeze:
    name: the audited program
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: node .github/scripts/freeze.mjs
